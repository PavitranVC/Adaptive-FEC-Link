name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install matplotlib (optional, for the plot smoke test)
        run: python3 -m pip install matplotlib || echo "matplotlib not installed - plot smoke test will be skipped"
      - name: Build
        run: make
      - name: Test
        run: make test

  sanitize:
    name: sanitize (ubuntu, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitizer tests
        run: make sanitize
